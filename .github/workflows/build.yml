name: Build and Release

on:
  push:
    branches: ["master", "main"]
    tags: ["v*"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: write

# 同一 ref 的新推送自动取消仍在跑的旧运行，快速连续推送时节省 runner 资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI 每次都是全新还原的缓存，增量编译产物是纯开销
  CARGO_INCREMENTAL: "0"

jobs:
  # ── 测试：独立 job 与打包并行，用 cargo-nextest（跨测试二进制并行执行、
  #    失败隔离、输出更清晰；本仓库无可运行 doctest，覆盖与 cargo test 等价）──
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # hosted Windows runner 上 Defender 实时扫描会显著拖慢 rustc/link.exe 的
      # 文件 IO（runner 一次性环境，跑完即销毁，本机开发不受影响）
      - name: Disable Defender realtime monitoring
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true
            Write-Host "Defender realtime monitoring disabled"
          } catch {
            Write-Host "Skip (no permission): $_"
          }

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Tauri v2 Linux 系统依赖（WebKitGTK 4.1 + GTK3 等，编译 src-tauri 测试必需）
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      # 准备各平台官方 pdfium 二进制（用于编译期直接内嵌进二进制）
      - name: Prepare pdfium (Windows x64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz" -OutFile "pdfium.tgz"
          tar -xzf pdfium.tgz
          Copy-Item "bin/pdfium.dll" "pdfium.dll"

      - name: Prepare pdfium (Linux x64)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -L -o pdfium.tgz "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-linux-x64.tgz"
          tar -xzf pdfium.tgz
          mkdir -p crates/core/assets
          cp lib/libpdfium.so crates/core/assets/

      - name: Prepare pdfium (macOS arm64)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl -L -o pdfium.tgz "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-mac-arm64.tgz"
          tar -xzf pdfium.tgz
          mkdir -p crates/core/assets
          cp lib/libpdfium.dylib crates/core/assets/

      - name: Run tests
        run: cargo nextest run --workspace --locked
        env:
          # CI 测试不需要本地调试用的 PDB：跳过 /DEBUG 与 PDB 生成，
          # MSVC 下编译+链接明显提速（本地开发不受影响）
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"

  # ── 便携版（--no-bundle）：轻量 zip，需系统已装 WebView2 ──
  build:
    name: Portable (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: handwrite-sim-windows-x86_64
            exe_name: handwrite-sim.exe
          - os: ubuntu-latest
            artifact: handwrite-sim-linux-x86_64
            exe_name: handwrite-sim
          - os: macos-latest
            artifact: handwrite-sim-macos-arm64
            exe_name: handwrite-sim
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # hosted Windows runner 上 Defender 实时扫描会显著拖慢 rustc/link.exe 的文件 IO
      - name: Disable Defender realtime monitoring
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true
            Write-Host "Defender realtime monitoring disabled"
          } catch {
            Write-Host "Skip (no permission): $_"
          }

      # Tauri v2 Linux 系统依赖（WebKitGTK 4.1 + GTK3 等）
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      # 准备各平台官方 pdfium 二进制（用于编译期直接内嵌进二进制）
      - name: Prepare pdfium (Windows x64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz" -OutFile "pdfium.tgz"
          tar -xzf pdfium.tgz
          Copy-Item "bin/pdfium.dll" "pdfium.dll"

      - name: Prepare pdfium (Linux x64)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -L -o pdfium.tgz "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-linux-x64.tgz"
          tar -xzf pdfium.tgz
          mkdir -p crates/core/assets
          cp lib/libpdfium.so crates/core/assets/

      - name: Prepare pdfium (macOS arm64)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl -L -o pdfium.tgz "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-mac-arm64.tgz"
          tar -xzf pdfium.tgz
          mkdir -p crates/core/assets
          cp lib/libpdfium.dylib crates/core/assets/

      - name: Install dependencies（根 workspace，含 web 前端）
        run: pnpm install

      # --no-bundle：不做安装器，只产出裸二进制（便携 zip 分发模式）。
      # beforeBuildCommand 自动执行 vue-tsc + vite build 并嵌入前端。
      - name: Build (release, Tauri --no-bundle)
        run: pnpm tauri build --no-bundle

      # macOS 可执行文件需 ad-hoc 签名，否则 Gatekeeper 会拦截
      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --deep -s - "target/release/${{ matrix.exe_name }}"

      # 组装便携包：二进制 + 预设 + 背景 + 空 fonts 目录（用户自备字体）
      # 同时产出单文件 exe（老用户升级直接替换旧 exe，应用内自动更新优先使用）
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "staging/fonts", "staging/backgrounds", "staging/presets" | Out-Null
          Copy-Item -Recurse "backgrounds/*" "staging/backgrounds/"
          Copy-Item -Recurse "presets/*" "staging/presets/"
          Copy-Item "target/release/${{ matrix.exe_name }}" "staging/"
          Copy-Item "packaging/fonts-README.txt" "staging/fonts/README.txt"
          Compress-Archive -Path "staging/*" -DestinationPath "${{ matrix.artifact }}.zip" -Force
          Copy-Item "target/release/${{ matrix.exe_name }}" "${{ matrix.artifact }}.exe"

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          mkdir -p staging/fonts staging/backgrounds staging/presets
          cp -r backgrounds/. staging/backgrounds/
          cp -r presets/. staging/presets/
          cp "target/release/${{ matrix.exe_name }}" staging/
          chmod +x "staging/${{ matrix.exe_name }}"
          cp packaging/fonts-README.txt staging/fonts/README.txt
          cd staging
          zip -r "../${{ matrix.artifact }}.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

      # 单文件版：老用户升级无需下载整包，直接替换旧 exe 即可
      - name: Upload single-file exe (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-exe
          path: ${{ matrix.artifact }}.exe
          if-no-files-found: error

  # ── Windows 便携版（内置 WebView2 Fixed Runtime，解压即用，无需安装）──
  # 原理：下载 Microsoft WebView2 Fixed Runtime (约 180 MB 解压)，随 exe 一起打进
  # staging/WebView2/，Rust 启动时探测 exe 旁 WebView2 目录并设
  # WEBVIEW2_BROWSER_EXECUTABLE_FOLDER，使 wry 优先加载该目录，离线/受限账户可用。
  # 与轻量便携版共存：handwrite-sim-windows-x86_64.zip（~10 MB，需系统 WebView2）
  #                handwrite-sim-windows-x86_64-webview2.zip（~150 MB，内置运行时）
  # 复用 build job 产出的同一份 Windows 二进制（同一次编译），
  # 不再重复整个 release 构建（此前 tag 构建要多花约 14 分钟与一份独立缓存）。
  portable-webview2:
    name: Portable WebView2 (Windows fixed runtime)
    runs-on: windows-latest
    # 仅在打 tag 时构建（~150MB，需复制运行时，耗时）；PR / master 推送不跑以省资源
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Download portable artifact
        uses: actions/download-artifact@v8
        with:
          name: handwrite-sim-windows-x86_64

      - name: Extract exe
        shell: pwsh
        run: |
          Expand-Archive -Path "handwrite-sim-windows-x86_64.zip" -DestinationPath "extracted" -Force
          if (-not (Test-Path "extracted/handwrite-sim.exe")) {
            throw "extracted/handwrite-sim.exe missing"
          }

      - name: Disable Defender realtime monitoring
        shell: pwsh
        run: |
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true
            Write-Host "Defender realtime monitoring disabled"
          } catch {
            Write-Host "Skip (no permission): $_"
          }

      - name: Download WebView2 Fixed Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # 优先复用 runner 预装的 Edge WebView2（最快、无需外网、版本与系统一致）
          $edgePaths = @(
            "C:\Program Files (x86)\Microsoft\EdgeWebView\Application",
            "C:\Program Files\Microsoft\EdgeWebView\Application"
          )
          $runtimeDir = $null
          foreach ($p in $edgePaths) {
            if (Test-Path $p) {
              $latest = Get-ChildItem -Directory $p |
                Where-Object { $_.Name -match "^\d+\.\d+" } |
                Sort-Object { try { [version]$_.Name } catch { $_.Name } } -Descending |
                Select-Object -First 1
              if ($latest -and (Test-Path (Join-Path $latest.FullName "msedgewebview2.exe"))) {
                $runtimeDir = $latest.FullName
                Write-Host "Found preinstalled WebView2 at $runtimeDir"
                break
              }
            }
          }
          if (-not $runtimeDir) {
            Write-Host "Preinstalled runtime not found, fallback to NuGet/CAB download..."
            $version = "128.0.2739.54"
            $urls = @(
              "https://globalcdn.nuget.org/packages/microsoft.web.webview2.fixedversionruntime.$version.nupkg",
              "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2.FixedVersionRuntime/$version",
              "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2.fixedversionruntime/$version/microsoft.web.webview2.fixedversionruntime.$version.nupkg"
            )
            $nupkg = "webview2.nupkg"
            $downloaded = $false
            foreach ($url in $urls) {
              try {
                Write-Host "Trying $url"
                Invoke-WebRequest -Uri $url -OutFile $nupkg -UseBasicParsing -TimeoutSec 60
                $downloaded = $true
                Write-Host "Downloaded from $url"
                break
              } catch { Write-Host "Failed $url : $_" }
            }
            if (-not $downloaded) { throw "Failed to download Fixed Runtime and no preinstalled runtime found" }
            Write-Host "Extracting $nupkg ..."
            if (Test-Path "webview2-extract") { Remove-Item -Recurse -Force "webview2-extract" }
            Expand-Archive -Path $nupkg -DestinationPath webview2-extract -Force
            Write-Host "Searching for msedgewebview2.exe ..."
            $exe = Get-ChildItem -Recurse -Filter "msedgewebview2.exe" -Path webview2-extract | Select-Object -First 1
            if (-not $exe) {
              Write-Host "Directory tree:"
              Get-ChildItem -Recurse webview2-extract | Select-Object FullName | Format-List | Out-String -Width 300 | Write-Host
              throw "msedgewebview2.exe not found in extracted nupkg"
            }
            $runtimeDir = $exe.Directory.FullName
            Write-Host "Found runtime dir from nupkg: $runtimeDir"
          }
          Write-Host "Runtime dir: $runtimeDir"
          Write-Host "Size: $([math]::Round((Get-ChildItem -Recurse $runtimeDir | Measure-Object -Property Length -Sum).Sum / 1MB, 1)) MB"
          # 校验关键文件
          if (-not (Test-Path (Join-Path $runtimeDir "msedgewebview2.exe"))) {
            throw "msedgewebview2.exe missing in $runtimeDir"
          }
          "RUNTIME_DIR=$runtimeDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package portable with WebView2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $runtimeDir = $env:RUNTIME_DIR
          if (-not $runtimeDir -or -not (Test-Path $runtimeDir)) {
            throw "RUNTIME_DIR not set or not found: $runtimeDir"
          }
          Write-Host "Assembling portable-webview2 staging ..."
          if (Test-Path staging) { Remove-Item -Recurse -Force staging }
          New-Item -ItemType Directory -Force "staging/fonts", "staging/backgrounds", "staging/presets" | Out-Null
          Copy-Item -Recurse "backgrounds/*" "staging/backgrounds/"
          Copy-Item -Recurse "presets/*" "staging/presets/"
          Copy-Item "extracted/handwrite-sim.exe" "staging/"
          Copy-Item "packaging/fonts-README.txt" "staging/fonts/README.txt"
          Write-Host "Copying WebView2 runtime to staging/WebView2 ..."
          Copy-Item -Recurse -Force $runtimeDir "staging/WebView2"
          # 校验
          if (-not (Test-Path "staging/WebView2/msedgewebview2.exe")) {
            Get-ChildItem -Recurse staging/WebView2 | Select-Object FullName,Length | Format-List | Out-String -Width 300 | Write-Host
            throw "staging/WebView2/msedgewebview2.exe missing after copy"
          }
          Write-Host "Staging content:"
          Get-ChildItem -Recurse staging | Select-Object FullName,Length | Format-List | Out-String -Width 300 | Write-Host
          $zip = "handwrite-sim-windows-x86_64-webview2.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path "staging/*" -DestinationPath $zip -Force
          Write-Host "Created $zip : $((Get-Item $zip).Length / 1MB) MB"

      - name: Upload portable WebView2
        uses: actions/upload-artifact@v7
        with:
          name: handwrite-sim-windows-x86_64-webview2
          path: handwrite-sim-windows-x86_64-webview2.zip
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [test, build, portable-webview2]
    # 必须 test 与 build 全部成功才允许发版；portable-webview2 在 PR / master 推送时被跳过，用 always() 兼容
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.test.result == 'success' && needs.build.result == 'success' && (needs.portable-webview2.result == 'success' || needs.portable-webview2.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # 从 CHANGELOG.md 提取当前版本小节（## [x.y.z] 到下一个 ##），
      # 拼上固定模板（下载说明/字体说明）作为 release 说明
      - name: Generate release notes
        shell: bash
        run: bash .github/release-notes.sh

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.exe
          body_path: RELEASE_NOTES.md
