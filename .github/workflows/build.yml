name: Build and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: handwrite-sim-windows-x86_64
            exe_name: handwrite-sim.exe
            tauri_bin: web/node_modules/.bin/tauri.CMD
          - os: ubuntu-latest
            artifact: handwrite-sim-linux-x86_64
            exe_name: handwrite-sim
            tauri_bin: web/node_modules/.bin/tauri
          - os: macos-latest
            artifact: handwrite-sim-macos-arm64
            exe_name: handwrite-sim
            tauri_bin: web/node_modules/.bin/tauri
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # Tauri v2 Linux 系统依赖（WebKitGTK 4.1 + GTK3 等）
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm --dir web install

      - name: Run tests
        run: cargo test --workspace

      # --no-bundle：不做安装器，只产出裸二进制（便携 zip 分发模式）。
      # beforeBuildCommand 自动执行 vue-tsc + vite build 并嵌入前端。
      - name: Build (release, Tauri)
        run: '& "${{ matrix.tauri_bin }}" build --no-bundle'
        shell: pwsh

      # macOS 可执行文件需 ad-hoc 签名，否则 Gatekeeper 会拦截
      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --deep -s - "target/release/${{ matrix.exe_name }}"

      # 组装便携包：二进制 + 预设 + 背景 + 空 fonts 目录（用户自备字体）
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "staging/fonts", "staging/backgrounds", "staging/presets" | Out-Null
          Copy-Item -Recurse "backgrounds/*" "staging/backgrounds/"
          Copy-Item -Recurse "presets/*" "staging/presets/"
          Copy-Item "target/release/${{ matrix.exe_name }}" "staging/"
          Copy-Item "packaging/fonts-README.txt" "staging/fonts/README.txt"
          Compress-Archive -Path "staging/*" -DestinationPath "${{ matrix.artifact }}.zip" -Force

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          mkdir -p staging/fonts staging/backgrounds staging/presets
          cp -r backgrounds/. staging/backgrounds/
          cp -r presets/. staging/presets/
          cp "target/release/${{ matrix.exe_name }}" staging/
          cp packaging/fonts-README.txt staging/fonts/README.txt
          cd staging
          zip -r "../${{ matrix.artifact }}.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 从 CHANGELOG.md 提取当前版本小节（## [x.y.z] 到下一个 ##），
      # 拼上固定模板（下载说明/字体说明）作为 release 说明
      - name: Generate release notes
        shell: bash
        run: bash .github/release-notes.sh

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          body_path: RELEASE_NOTES.md
