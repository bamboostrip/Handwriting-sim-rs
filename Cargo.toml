# Tauri 工作区：crates/core 为渲染引擎核心库，src-tauri 为桌面应用壳。
# 前端（Vue 3）位于仓库根目录，符合 create-tauri-app 标准布局。
[workspace]
members = ["crates/core", "src-tauri"]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
debug = 1
incremental = true

# dev 构建下优化核心渲染路径：debug 未优化时引擎慢 10~30 倍，
# 预览/导出会卡顿数秒。只优化重计算 crate，编译时间基本不受影响。
[profile.dev.package."handwrite-sim"]
opt-level = 2
debug = 1


[profile.dev.package.ab_glyph]
opt-level = 2

[profile.dev.package.fast_image_resize]
opt-level = 3

[profile.dev.package.image]
opt-level = 2

[profile.dev.package.pdfium-render]
opt-level = 2
