[package]
name = "handwrite-sim"
version = "0.1.0"
edition = "2021"
description = "手写模拟器（Rust 版）- 基于 egui + 自研笔画扰动引擎的手写体生成工具"
license = "MIT"
authors = ["bamboostrip"]
repository = "https://github.com/bamboostrip/handwrite-sim"

# ---------------------------------------------------------------------------
# 依赖说明
# - eframe/egui: 即时模式 GUI（MIT/Apache-2.0；glow OpenGL 后端兼容性最好，
#                Windows 走 WARP 软件 GL、Linux 走 llvmpipe；无 GPU 老机器/
#                虚拟机可跑；段落编辑器每行真对齐由 epaint halign_and_justify_row 实现）
# - ab_glyph: 字体光栅化（替代 Python 版 PIL FreeType 黑盒）
# - image: 图像加载/保存（PNG/webp 背景、导出）
# - rand/rand_distr: 笔画扰动随机数（正态分布）
# - serde: 预设 JSON 持久化
# - rfd: 原生文件对话框（选字体/背景/导出目录）
# ---------------------------------------------------------------------------
[dependencies]
# egui/eframe: 即时模式 GUI（MIT/Apache-2.0）。
# - glow: OpenGL 后端（老机器/虚拟机兼容性最好，Windows 走 WARP 软件 GL、Linux 走 llvmpipe）
# - default_fonts: 保留默认字体（CJK 需启动时手动加载，见 app.rs）
# - wayland/x11: Linux 原生窗口
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
ab_glyph = "0.2"
image = "0.25"
rand = "0.9"
rand_distr = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rfd = "0.15"
# docx 导入：手写解析（zip + quick-xml），完整对齐 Python 版 docx_io.py 语义，
# 避免第三方 docx 库读取 API 限制（详见 docs/superpowers/specs 阶段三设计）
zip = "8"
quick-xml = "0.41"
# PDF 导出：位图层方案（MIT；禁用默认 html feature 避开 azul 依赖树）
printpdf = { version = "0.12", default-features = false, features = ["images"] }
lopdf = "0.44.0"
# 预览降采样：SIMD 加速重采样（image::imageops::resize 对千万像素级输入极慢，
# 32MP 背景 Lanczos3 实测 80s；本库同滤镜毫秒级）。rayon 开启多线程。
fast_image_resize = { version = "6", features = ["rayon"] }

[build-dependencies]
# Windows exe 资源嵌入（窗口图标，仅 win32 生效）
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
# 越小越快的分发体积（与 Python 版 PyInstaller 产物对比）
opt-level = 3
lto = true
codegen-units = 1
strip = true