# Tauri 工作区：crates/core 为渲染引擎核心库，src-tauri 为桌面应用壳。
# 前端（Vue 3）位于仓库根目录，符合 create-tauri-app 标准布局。
[workspace]
members = ["crates/core", "src-tauri"]
resolver = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"


[profile.dev]
# line-tables-only：保留行号映射（backtrace 可读），不生成变量/类型调试信息。
# 相比 debug=1，codegen 与链接体积都明显下降，是最划算的 dev 提速项。
# CI 仍可用 CARGO_PROFILE_DEV_DEBUG=0 一键全关。
debug = "line-tables-only"
incremental = true

# 性能验证走独立 profile：dev 只负责快速迭代，默认不抬高 opt-level。
# 需要测渲染性能时用 `cargo build --profile preview`
# （Tauri 侧：`cargo tauri dev --profile preview`）。
[profile.preview]
inherits = "dev"
opt-level = 2

# preview 下只给最吃 CPU 的重采样库额外加满优化。
[profile.preview.package.fast_image_resize]
opt-level = 3
