[package]
name = "handwrite-sim-tauri"
version = "0.3.3"


edition = "2021"
description = "手写模拟器桌面端（Tauri 2）：复用 crates/core 渲染引擎，Vue 前端位于仓库根目录"
license = "MIT"
authors = ["bamboostrip"]
repository = "https://github.com/bamboostrip/handwrite-sim"

[[bin]]
name = "handwrite-sim"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking", "default-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
handwrite-sim = { path = "../crates/core" }



